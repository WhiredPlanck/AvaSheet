name: CI

# 提交到 main 与提交 PR 时验证构建、测试与代码格式。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支上连续推送时，取消还在跑的上一次，省 runner。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 还原依赖
        run: dotnet restore

      - name: 构建
        run: dotnet build -c Release --no-restore -warnaserror

      - name: 运行测试
        run: dotnet test -c Release --no-build --verbosity normal

      - name: 检查代码格式
        run: dotnet format AvaSheet.slnx --verify-no-changes --no-restore
